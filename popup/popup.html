<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lookalike</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- Header with Stats -->
    <header class="header">
      <div class="logo-area">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M2 6C2 4.89543 2.89543 4 4 4H20C21.1046 4 22 4.89543 22 6V18C22 19.1046 21.1046 20 20 20H4C2.89543 20 2 19.1046 2 18V6Z" stroke="currentColor" stroke-width="2"/>
          <path d="M2 9H22" stroke="currentColor" stroke-width="2"/>
          <path d="M6 13H10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M6 16H14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <h1>Lookalike</h1>
      </div>
      <div class="stats-mini">
        <span id="total-tabs" class="stat-item" title="Analyzed Tabs">0</span>
        <span class="divider">/</span>
        <span id="total-groups" class="stat-item" title="Groups">0</span>
      </div>
    </header>

    <!-- Model Status Banner -->
    <div id="model-status" class="model-status">
      <div class="model-status-icon">
        <div class="spinner-small"></div>
      </div>
      <span class="model-status-text">Loading semantic model...</span>
    </div>

    <!-- Main Action Area -->
    <div class="action-bar">
      <button class="btn-primary" id="analyze-all-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="M21 21l-4.35-4.35"></path>
        </svg>
        <span>Analyze All</span>
      </button>
      <button class="btn-secondary" id="regroup-btn" title="Regroup Tabs">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
        </svg>
      </button>
      <button class="btn-icon" id="ungroup-btn" title="Ungroup All">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"/>
        </svg>
      </button>
    </div>

    <!-- Content Area -->
    <main class="content-scroll">
      <!-- Groups -->
      <div id="groups-list" class="list-section">
        <!-- Populated via JS -->
      </div>

      <!-- Ungrouped -->
      <div id="ungrouped-list" class="list-section">
        <!-- Populated via JS -->
      </div>
      
      <!-- Loading State -->
      <div class="state-message" id="loading">
        <div class="spinner"></div>
        <p>Analyzing tabs...</p>
      </div>

      <!-- Empty State -->
      <div class="state-message" id="empty-state">
        <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="3" width="18" height="18" rx="2"></rect>
          <path d="M3 9h18"></path>
          <path d="M9 21V9"></path>
        </svg>
        <p>Click "Analyze All" to start</p>
        <span class="empty-hint">Semantic AI will group similar tabs</span>
      </div>
    </main>

    <!-- Footer Controls -->
    <footer class="footer">
      <button class="footer-link" id="analyze-current">Analyze Current</button>
      <button class="footer-link" id="clear-cache">Reset All</button>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
